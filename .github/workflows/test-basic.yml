name: Test Ambuild Basic

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"  # with run_tests.py's seed, makes the random tests reproducible
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Ambuild
      run: |
        python -m pip install --upgrade pip
        pip install . jsonschema  # jsonschema: the export schema test (tests/testExport.py)
    - name: Run CPU tests
      working-directory: ./tests
      run: python run_tests.py
