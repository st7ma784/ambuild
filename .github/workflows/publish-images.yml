name: Publish images

# Builds each service's container image and pushes it to GitHub's container registry,
# ghcr.io/<owner>/<image>, so each machine of a deployment pulls only what it runs
# (docs/deployment.md). On every push to master: tags sha-<commit> and latest; on a tag
# vX.Y.Z: X.Y.Z and X.Y (the Helm chart's default image tag is its appVersion). Nothing
# is scheduled.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the build runtime (HOOMD-blue, Poreblazer): for running Ambuild, e.g. with Apptainer on a cluster
          - {image: ambuild, file: Dockerfile, target: ambuild-poreblazer}
          # the agent: local builds in its container, or Slurm through slurmrestd
          - {image: ambuild-agent, file: Dockerfile, target: ambuild-agent}
          - {image: ambuild-web, file: services/web/Dockerfile, target: web}
          - {image: ambuild-campaigns, file: services/campaigns/Dockerfile, target: ""}
          # ambuild-upload: creates the tables and bucket (--init), scans run directories
          - {image: ambuild-uploader, file: services/ingest/Dockerfile, target: uploader}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        tags: |
          type=sha,prefix=sha-,format=short
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.file }}
        target: ${{ matrix.target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
