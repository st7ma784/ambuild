name: Test web GUI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    # ambuild-web against PostgreSQL and SeaweedFS (deploy/docker-compose.yml)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run web tests
      run: docker compose -f deploy/docker-compose.yml --profile web-test run --rm --build web-test
    - name: Service logs
      if: failure()
      run: docker compose -f deploy/docker-compose.yml logs
    - name: Stop services
      if: always()
      run: docker compose -f deploy/docker-compose.yml down -v

  agent:
    # Submission end to end: API -> queue -> local agent -> upload -> run page; the same
    # structure from the command line; cancelling (deploy/demo/check_submit.py)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Submit, build, compare and cancel
      run: docker compose -f deploy/docker-compose.yml --profile agent-test run --rm --build agent-test
    - name: Service logs
      if: failure()
      run: docker compose -f deploy/docker-compose.yml --profile agent-test logs
    - name: Stop services
      if: always()
      run: docker compose -f deploy/docker-compose.yml --profile agent-test down -v

  campaigns:
    # The campaign controller's proposals (Optuna), and a simulated campaign, without the
    # web API; the Slurm test runs a real campaign end to end
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Controller tests
      run: |
        pip install --no-deps . && pip install ./services/campaigns pytest
        cd services/campaigns && python -m pytest -q -p no:cacheprovider tests

  chart:
    # The Helm chart: strict lint, size budget (Fleet and Helm cap bundles and releases at
    # ~1 MiB), and the rendered manifests validated against the Kubernetes schemas
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
      with:
        version: v3.16.2
    - name: Lint and size budget
      run: sh scripts/check_chart_size.sh deploy/helm/ambuild
    - name: Validate manifests
      run: |
        for agent in false true; do
          helm template ci deploy/helm/ambuild --set ingress.enabled=true --set ingress.tlsSecret=tls \
            --set agent.enabled=$agent --set campaigns.enabled=$agent > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7-alpine -strict -summary /w/rendered.yaml
        done
