name: Test Ambuild HOOMD-blue 7

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hoomd7:
    # The full test suite, including the HOOMD engine parity test, with HOOMD-blue 7
    # from conda-forge (tests/docker/hoomd7.Dockerfile)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the HOOMD-blue 7 image
      run: docker build -f tests/docker/hoomd7.Dockerfile -t ambuild-hoomd7 .
    - name: Run the test suite
      run: |
        docker run --rm --user "$(id -u)" -v "$PWD:/ambuild" -w /ambuild/tests \
          -e PYTHONPATH=/ambuild -e PYTHONHASHSEED=0 ambuild-hoomd7 python run_tests.py

  xtb:
    # The xtb stage against the real programs: tblite, ASE and the xtb binary
    # (tests/docker/xtb.Dockerfile, docs/xtb-spec.md)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the xTB image
      run: docker build -f tests/docker/xtb.Dockerfile -t ambuild-xtb tests/docker
    - name: Run the xTB tests
      run: |
        docker run --rm --user "$(id -u)" -v "$PWD:/ambuild" -w /ambuild/tests \
          -e PYTHONPATH=/ambuild -e PYTHONHASHSEED=0 -e OMP_NUM_THREADS=2 ambuild-xtb python -m unittest -v testXtb

  image:
    # The runtime image (root Dockerfile): the full suite against the installed package,
    # with HOOMD-blue 7 and a real Poreblazer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the ambuild-poreblazer image
      run: docker build --target ambuild-poreblazer -t ambuild:test .
    - name: Run the test suite in the image
      run: |
        docker run --rm --user "$(id -u)" -v "$PWD/tests:/tests" -w /tests \
          -e PYTHONHASHSEED=0 ambuild:test python run_tests.py
    - name: Image sizes
      run: |
        docker build -q --target ambuild -t ambuild:slim . > /dev/null
        docker images ambuild
