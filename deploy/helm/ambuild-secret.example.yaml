# The Secret the ambuild chart reads (values: existingSecret). Create it in the release's
# namespace outside Git, e.g.:
#   kubectl -n ambuild create secret generic ambuild \
#     --from-literal=DATABASE_URL='postgresql://ambuild:PASSWORD@postgres.db:5432/ambuild' \
#     --from-literal=AWS_ACCESS_KEY_ID=ambuild --from-literal=AWS_SECRET_ACCESS_KEY=SECRET
# Kept outside the chart directory, so Fleet never bundles it.
apiVersion: v1
kind: Secret
metadata:
  name: ambuild
  namespace: ambuild
type: Opaque
stringData:
  DATABASE_URL: postgresql://ambuild:CHANGE-ME@postgres.db:5432/ambuild
  AWS_ACCESS_KEY_ID: ambuild
  AWS_SECRET_ACCESS_KEY: CHANGE-ME
