{{- if .Values.agent.enabled }}
# The K3s agent: claims submissions for the "local" backend from the web API and runs them
# in this pod, then uploads them. Its token (AMBUILD_AGENT_TOKEN) is in the Secret; the
# web pod's init container registers it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    app.kubernetes.io/name: ambuild-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ambuild
spec:
  replicas: 1
  strategy: {type: Recreate}  # one agent identity: never two pods with the same token
  selector:
    matchLabels: {app.kubernetes.io/name: ambuild-agent, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ambuild-agent, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      # time for running builds to be cancelled and uploaded when the pod stops
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "ambuild.name" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: AMBUILD_API_URL, value: "http://{{ include "ambuild.name" . }}:{{ .Values.service.port }}"}
            - {name: AMBUILD_AGENT_SLOTS, value: {{ .Values.agent.slots | quote }}}
            - {name: AMBUILD_AGENT_DIR, value: /work}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: work, mountPath: /work}]
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: work
          emptyDir: {sizeLimit: {{ .Values.agent.workSize }}}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
