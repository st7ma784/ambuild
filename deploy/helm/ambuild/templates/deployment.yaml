apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ambuild.name" . }}
  labels: {{- include "ambuild.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "ambuild.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ambuild.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      initContainers:
        # The web GUI's tables (idempotent), and the K3s agent's and campaign controller's tokens
        - name: init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - init
            {{- if .Values.agent.enabled }}
            - --agent={{ .Release.Name }}-k3s:local:$(AMBUILD_AGENT_TOKEN)
            {{- end }}
            {{- if .Values.campaigns.enabled }}
            - --agent={{ .Release.Name }}-campaigns:campaigns:$(AMBUILD_CAMPAIGNS_TOKEN)
            {{- end }}
          envFrom:
            - configMapRef: {name: {{ include "ambuild.name" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ include "ambuild.name" . }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes: [{name: tmp, emptyDir: {}}]
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
