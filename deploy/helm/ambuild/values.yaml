# ambuild chart: the web interface, and optionally an agent. PostgreSQL and S3 storage are
# external: point at them here. Keep this chart small (Fleet and Helm limit a bundle or
# release to about 1 MiB; scripts/check_chart_size.sh enforces a budget far below that).

image:
  repository: ghcr.io/st7ma784/ambuild-web
  tag: ""  # default: the chart's appVersion
  pullPolicy: IfNotPresent

replicas: 1
title: Ambuild

# Credentials come from a Secret created outside Git (see ../ambuild-secret.example.yaml):
# DATABASE_URL, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
existingSecret: ambuild

s3:
  endpointUrl: ""  # empty: AWS S3; e.g. http://seaweedfs-s3.storage:8333
  bucket: ambuild-runs
  prefix: ""
  region: us-east-1

service:
  port: 80

# Internal tool with no sign-in yet: expose it on the lab network only. On K3s (Traefik)
# restrict it with an ipAllowList middleware, e.g.
#   annotations:
#     traefik.ingress.kubernetes.io/router.middlewares: ambuild-lab-only@kubernetescrd
ingress:
  enabled: false
  className: ""
  host: ambuild.example.internal
  annotations: {}
  tlsSecret: ""

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}

# The K3s agent: runs submitted recipes in a pod of its own (one at a time per slot) and
# uploads them. Needs AMBUILD_AGENT_TOKEN in the Secret.
agent:
  enabled: false
  image:
    repository: ghcr.io/st7ma784/ambuild-agent
    tag: ""  # default: the chart's appVersion
  slots: 1
  workSize: 10Gi  # run directories, until uploaded
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {memory: 4Gi}

# The campaign controller (Optuna): needs AMBUILD_CAMPAIGNS_TOKEN in the Secret
campaigns:
  enabled: false
  image:
    repository: ghcr.io/st7ma784/ambuild-campaigns
    tag: ""  # default: the chart's appVersion
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
