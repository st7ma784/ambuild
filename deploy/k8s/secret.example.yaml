# Connection settings for ambuild-upload. Copy, fill in and apply; do not commit
# the filled-in copy. With sealed-secrets or external-secrets, generate it instead.
apiVersion: v1
kind: Secret
metadata:
  name: ambuild-upload
  labels: {app.kubernetes.io/part-of: ambuild}
type: Opaque
stringData:
  DATABASE_URL: postgresql://ambuild:CHANGE-ME@postgres.ambuild.svc:5432/ambuild
  AMBUILD_S3_BUCKET: ambuild-runs
  S3_ENDPOINT_URL: http://seaweedfs-s3.ambuild.svc:8333
  AWS_ACCESS_KEY_ID: CHANGE-ME
  AWS_SECRET_ACCESS_KEY: CHANGE-ME
  AWS_DEFAULT_REGION: us-east-1
