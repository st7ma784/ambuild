# Fallback uploader for K3s: the one-off Job that creates the database tables. The scan
# that uploads runs the Slurm upload jobs missed is upload-scan.yaml, run on demand.
# The primary path is the afterany upload job submitted by deploy/slurm/submit_build.sh.
#
# Build and push the image from the repository root, then set it below:
#   docker build -f services/ingest/Dockerfile -t <registry>/ambuild-ingest:0.1.0 .
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ambuild-upload-init
  labels: {app.kubernetes.io/part-of: ambuild, app.kubernetes.io/component: uploader}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: init
          image: ghcr.io/st7ma784/ambuild-ingest:0.1.0
          args: ["--init"]
          envFrom: [{secretRef: {name: ambuild-upload}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
