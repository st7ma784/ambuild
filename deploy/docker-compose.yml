# Local stack for recorded runs: PostgreSQL, S3-compatible storage (SeaweedFS) and the uploader.
# Development defaults only; set real credentials in deploy/.env (see .env.example).
#
#   docker compose -f deploy/docker-compose.yml up -d            # postgres, seaweedfs, init
#   docker compose -f deploy/docker-compose.yml run --rm uploader --scan /runs
#   docker compose -f deploy/docker-compose.yml --profile test run --rm ingest-test
#   docker compose -f deploy/docker-compose.yml --profile web up     # web GUI demo on http://127.0.0.1:8080
#                                                                    # and MLflow on http://127.0.0.1:5050
#   docker compose -f deploy/docker-compose.yml --profile web-test run --rm --build web-test
#   docker compose -f deploy/docker-compose.yml --profile agent-test run --rm --build agent-test
name: ambuild

x-ingest-env: &ingest-env
  DATABASE_URL: postgresql://ambuild:${POSTGRES_PASSWORD:-ambuild-dev}@postgres:5432/ambuild
  AMBUILD_S3_BUCKET: ${AMBUILD_S3_BUCKET:-ambuild-runs}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ambuild}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ambuild-dev-secret}
  AWS_DEFAULT_REGION: us-east-1
  # Finished runs are logged to MLflow too (docs/mlflow.md); unreachable: a warning, no failure
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  AMBUILD_WEB_URL: ${AMBUILD_WEB_URL:-}
  AMBUILD_MLFLOW_URL: ${AMBUILD_MLFLOW_URL:-http://127.0.0.1:5050}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ambuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambuild-dev}
      POSTGRES_DB: ambuild
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambuild -d ambuild"]
      interval: 2s
      retries: 30

  seaweedfs:
    # S3-compatible object storage (MinIO no longer publishes container images).
    # Production can use any S3 API: SeaweedFS, MinIO, Ceph RGW or AWS S3.
    image: chrislusf/seaweedfs:3.97
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333"]
      interval: 2s
      retries: 60

  init:
    # Creates the database tables and the bucket; safe to run repeatedly
    build: {context: .., dockerfile: services/ingest/Dockerfile, target: uploader}
    image: ambuild-ingest
    environment: *ingest-env
    command: ["--init"]
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

  uploader:
    build: {context: .., dockerfile: services/ingest/Dockerfile, target: uploader}
    image: ambuild-ingest
    environment: *ingest-env
    volumes: ["${AMBUILD_RUNS_DIR:-./runs}:/runs"]
    depends_on:
      postgres: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    command: ["--scan", "/runs", "--stale-after", "86400"]
    profiles: ["tools"]

  ingest-test:
    build: {context: .., dockerfile: services/ingest/Dockerfile, target: test}
    image: ambuild-ingest-test
    environment: *ingest-env
    depends_on:
      postgres: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    profiles: ["test"]

  mlflow:
    # The MLflow tracking server (docs/mlflow.md): runs in PostgreSQL's "mlflow" database,
    # artifacts in the S3 store under s3://ambuild-mlflow
    build: {context: mlflow}
    image: ambuild-mlflow
    environment:
      MLFLOW_DATABASE_URL: postgresql://ambuild:${POSTGRES_PASSWORD:-ambuild-dev}@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://${AMBUILD_MLFLOW_BUCKET:-ambuild-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ambuild}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ambuild-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:${AMBUILD_MLFLOW_PORT:-5050}:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    profiles: ["web", "mlflow"]

  mlflow-backfill:
    # Logs the runs already in the database to MLflow (those not yet logged); safe to rerun
    build: {context: .., dockerfile: services/ingest/Dockerfile, target: uploader}
    image: ambuild-ingest
    environment: *ingest-env
    command: ["--mlflow-backfill"]
    depends_on:
      init: {condition: service_completed_successfully}
      mlflow: {condition: service_healthy}
    profiles: ["web", "mlflow"]

  web:
    # The web GUI (services/web; docs/web-gui.md)
    build: {context: .., dockerfile: services/web/Dockerfile, target: web}
    image: ambuild-web
    environment: *ingest-env
    ports: ["127.0.0.1:${AMBUILD_WEB_PORT:-8080}:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    profiles: ["web", "slurm-test", "agent-test"]  # the Slurm test checks runs through it

  web-init:
    # The web GUI's tables, and the demo agent and campaign controller registered with their tokens
    build: {context: .., dockerfile: services/web/Dockerfile, target: web}
    image: ambuild-web
    environment: *ingest-env
    command: ["init", "--agent", "local-demo:local:${AMBUILD_AGENT_TOKEN:-ambuild-dev-agent-token}",
              "--agent", "campaigns:campaigns:${AMBUILD_CAMPAIGNS_TOKEN:-ambuild-dev-campaigns-token}"]
    depends_on:
      init: {condition: service_completed_successfully}
    profiles: ["web", "agent-test"]

  agent:
    # Runs submitted recipes in this container (services/agent) and uploads them
    build: {context: .., dockerfile: Dockerfile, target: ambuild-agent}
    image: ambuild-agent
    environment:
      <<: *ingest-env
      AMBUILD_API_URL: http://web:8000
      AMBUILD_AGENT_TOKEN: ${AMBUILD_AGENT_TOKEN:-ambuild-dev-agent-token}
      AMBUILD_AGENT_SLOTS: ${AMBUILD_AGENT_SLOTS:-2}
    depends_on:
      web-init: {condition: service_completed_successfully}
      web: {condition: service_started}
    profiles: ["web", "agent-test"]

  campaigns:
    # The campaign controller (services/campaigns): proposes each round's points
    build: {context: .., dockerfile: services/campaigns/Dockerfile}
    image: ambuild-campaigns
    environment:
      AMBUILD_API_URL: http://web:8000
      AMBUILD_CAMPAIGNS_TOKEN: ${AMBUILD_CAMPAIGNS_TOKEN:-ambuild-dev-campaigns-token}
    depends_on:
      web-init: {condition: service_completed_successfully}
      web: {condition: service_started}
    profiles: ["web"]

  demo-recipes:
    # Saves the demo recipe, so the New run page has one to start from
    build: {context: .., dockerfile: Dockerfile, target: ambuild-agent}
    image: ambuild-agent
    environment: {AMBUILD_API_URL: "http://web:8000"}
    volumes: ["./demo:/demo:ro"]
    command: ["python", "/demo/seed_recipes.py"]
    depends_on:
      web-init: {condition: service_completed_successfully}
      web: {condition: service_started}
    profiles: ["web"]

  agent-test:
    # Submission end to end: browser API -> queue -> agent -> upload -> run page, and the
    # same structure from the command line
    build: {context: .., dockerfile: Dockerfile, target: ambuild-agent}
    image: ambuild-agent
    environment: {AMBUILD_API_URL: "http://web:8000"}
    volumes: ["./demo:/demo:ro", "../.claude/skills/ambuild:/skill:ro"]
    command: ["python", "/demo/check_submit.py"]
    depends_on:
      agent: {condition: service_started}
    profiles: ["agent-test"]

  demo-runs:
    # A few small recorded builds with Poreblazer results, for the demo (built once;
    # kept in the demo-runs volume). Root, so it can write the fresh named volume.
    build: {context: .., dockerfile: Dockerfile, target: ambuild-poreblazer}
    image: ambuild
    user: "0:0"
    volumes: ["demo-runs:/runs", "./demo:/demo:ro"]
    command: ["python", "/demo/make_runs.py", "/runs"]
    profiles: ["web"]

  demo-upload:
    # Uploads the demo runs, like the Slurm upload jobs do
    build: {context: .., dockerfile: services/ingest/Dockerfile, target: uploader}
    image: ambuild-ingest
    user: "0:0"
    environment: *ingest-env
    volumes: ["demo-runs:/runs"]
    command: ["--scan", "/runs", "--stale-after", "86400"]
    depends_on:
      init: {condition: service_completed_successfully}
      demo-runs: {condition: service_completed_successfully}
    profiles: ["web"]

  web-test:
    build: {context: .., dockerfile: services/web/Dockerfile, target: test}
    image: ambuild-web-test
    environment: *ingest-env
    depends_on:
      init: {condition: service_completed_successfully}
    profiles: ["web-test"]

  slurm-test:
    # Single-node Slurm cluster that runs deploy/slurm end to end against this stack
    build: {context: .., dockerfile: deploy/slurm/test/Dockerfile}
    image: ambuild-slurm-test
    hostname: slurmnode
    # slurmd clones new namespaces when it starts some jobs, which Docker's
    # default seccomp profile and capabilities forbid. Test container only.
    security_opt: ["seccomp=unconfined"]
    cap_add: [SYS_ADMIN]
    environment: *ingest-env
    depends_on:
      init: {condition: service_completed_successfully}
      web: {condition: service_started}
    profiles: ["slurm-test"]

volumes:
  pgdata:
  s3data:
  demo-runs:

configs:
  s3-identities:
    content: |
      {"identities": [{"name": "ambuild",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY:-ambuild}", "secretKey": "${S3_SECRET_KEY:-ambuild-dev-secret}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
