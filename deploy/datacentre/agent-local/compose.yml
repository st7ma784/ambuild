# A compute machine that builds submissions itself (the local backend): a workstation or
# a GPU box outside Slurm. Each agent runs AMBUILD_AGENT_SLOTS builds at once in its
# container and uploads them, so it needs the database and storage credentials (the
# builds themselves never see them). Run one per machine; register each (backend local).
#
#   cp agent.env.example agent.env          # chmod 600
#   docker compose --env-file agent.env up -d
name: ambuild-agent-local

services:
  agent:
    image: ghcr.io/st7ma784/ambuild-agent:${AMBUILD_TAG:-latest}
    restart: unless-stopped
    environment:
      AMBUILD_API_URL: ${AMBUILD_API_URL:?set AMBUILD_API_URL}
      AMBUILD_AGENT_TOKEN: ${AMBUILD_AGENT_TOKEN:?set AMBUILD_AGENT_TOKEN}
      AMBUILD_AGENT_BACKEND: local
      AMBUILD_AGENT_SLOTS: ${AMBUILD_AGENT_SLOTS:-2}
      # for uploading the runs
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AMBUILD_S3_BUCKET: ${AMBUILD_S3_BUCKET:-ambuild-runs}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes: ["agent-work:/home/ambuild/agent"]
    cpus: ${AMBUILD_AGENT_CPUS:-4}
    # on stop, running builds get 30 s to end, then are uploaded as failed and reported
    stop_grace_period: 2m
    # For GPUs (with the NVIDIA container toolkit), add:
    # deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}

volumes:
  agent-work:
