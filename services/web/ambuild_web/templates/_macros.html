{% macro chart(c, height=220) -%}
<figure class="chart" data-source="{{ c.id }}-data" data-height="{{ height }}">
  <figcaption>{{ c.title }}</figcaption>
  <div class="chart-canvas"></div>
  <script type="application/json" id="{{ c.id }}-data">{{ c | tojson }}</script>
</figure>
{%- endmacro %}

{% macro status(value) -%}
<span class="status state-{{ value | status_state }}">{{ value | status_label }}</span>
{%- endmacro %}

{% macro runlink(r) -%}
<a href="/runs/{{ r.run_id }}">{{ r.label }}</a> <code class="id">{{ r.run_id[:8] }}</code>
{%- endmacro %}
