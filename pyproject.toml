[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ambuild"
dynamic = ["version"]
description = "A program for creating polymeric molecular structures."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jens Thomas", email = "linucks42@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# HOOMD-blue is needed only for MD and geometry optimisation. It is not on PyPI, so it
# cannot be a pip extra: install it from conda-forge (e.g. micromamba install -c
# conda-forge "hoomd=7.2=cpu*"); see tests/docker/hoomd7.Dockerfile.

[project.urls]
Homepage = "https://github.com/linucks/ambuild"

[tool.setuptools.packages.find]
include = ["ambuild"]

[tool.setuptools.package-data]
ambuild = ["recipes/*.json", "recipes/params/*/*", "schemas/*.json"]  # example recipes and their parameters; export schemas

[tool.setuptools.dynamic]
version = { attr = "ambuild.version.__version__" }
